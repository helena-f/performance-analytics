[package]
name = "perf-analytics"
version = "0.1.0"
edition = "2021"
description = "A mini Instruments-style profiling tool backend"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
